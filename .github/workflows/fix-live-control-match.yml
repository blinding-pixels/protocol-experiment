name: Fix live control pattern match

on:
  push:
    branches:
      - formal/easycrypt-live-key-reduction
    paths:
      - '.github/workflows/fix-live-control-match.yml'

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Patch, audit, commit, push, and dispatch checker
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('formal/current-source/easycrypt/computational/LiveKeyGame.ec')
          text = path.read_text(encoding='utf-8')

          anchor = '''module LiveProtocolEnvironment(
            S : SIGNATURE_SCHEME,
          '''
          insertion = '''op live_query_kind_of_control
              (expected_kind : beekem_control_kind)
              (expected_author : principal)
              (expected_target : principal option) : live_query_kind =
            with expected_kind = BeeCreate => LiveCreateQuery expected_author
            with expected_kind = BeeAdd =>
              LiveAddQuery expected_author (oget expected_target)
            with expected_kind = BeeRemove =>
              LiveRemoveQuery expected_author (oget expected_target)
            with expected_kind = BeeUpdate => LiveUpdateQuery expected_author.

          module LiveProtocolEnvironment(
            S : SIGNATURE_SCHEME,
          '''
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one module anchor, found {text.count(anchor)}')
          text = text.replace(anchor, insertion)

          old = '''      query_kind <-
                with expected_kind = BeeCreate => LiveCreateQuery expected_author
                with expected_kind = BeeAdd =>
                  LiveAddQuery expected_author (oget expected_target)
                with expected_kind = BeeRemove =>
                  LiveRemoveQuery expected_author (oget expected_target)
                with expected_kind = BeeUpdate => LiveUpdateQuery expected_author;
          '''
          new = '''      query_kind <-
                live_query_kind_of_control
                  expected_kind expected_author expected_target;
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected one inline control match, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

          rm .github/workflows/fix-live-control-match.yml
          python3 tools/easycrypt/audit_computational.py
          python3 -m unittest discover \
            -s formal/current-source/easycrypt/computational \
            -p 'test_*.py' -v

          git config user.name 'blinding-pixels'
          git config user.email 'blindingpixels@protonmail.com'
          git add -A
          git commit -m 'fix: lower live control match through pure operator'
          git push origin "HEAD:${GITHUB_REF_NAME}"

          curl --fail --silent --show-error --location \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/easycrypt-computational.yml/dispatches" \
            --data "{\"ref\":\"${GITHUB_REF_NAME}\"}"
