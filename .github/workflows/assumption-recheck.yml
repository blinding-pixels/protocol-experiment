name: One-off formal assumption recheck

on:
  push:
    branches:
      - verification/assumption-recheck-20260825
    paths:
      - ".github/workflows/assumption-recheck.yml"
      - "verification/**"

permissions:
  contents: read

jobs:
  lean-wasm:
    name: Lean WASM lifecycle revalidation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Run pinned Lean WASM check
        run: bash verification/run-lean-wasm.sh
      - name: Upload Lean WASM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assumption-recheck-lean-wasm
          path: /tmp/assumption-recheck/lean
          if-no-files-found: warn

  proverif-docker:
    name: Dockerized ProVerif lifecycle revalidation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Run pinned Dockerized ProVerif check
        run: bash verification/run-proverif-docker.sh
      - name: Upload ProVerif evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assumption-recheck-proverif-docker
          path: /tmp/assumption-recheck/proverif-run
          if-no-files-found: warn
