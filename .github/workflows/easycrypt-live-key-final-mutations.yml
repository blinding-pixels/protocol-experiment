name: EasyCrypt live-key final-bound mutations

on:
  push:
    branches:
      - formal/easycrypt-live-key-reduction
    paths:
      - '.github/workflows/easycrypt-live-key-final-mutations.yml'
      - 'formal/current-source/easycrypt/computational/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: easycrypt-live-key-final-mutations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final-bound-mutations:
    name: Reject removed final-bound dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EASYCRYPT_IMAGE: ghcr.io/easycrypt/ec-test-box@sha256:84980006e8b01fe6497bbd0ecd67deeb5e7361d8ad17e27d24924122d368e0fc
      MUTATED_EC: LiveBeeKemAuthoritativeFinalBound.ec
      PUBLIC_EC: ComputationalProof.ec
    steps:
      - name: Check out exact proof source
        uses: actions/checkout@v4

      - name: Pull immutable EasyCrypt image
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$EASYCRYPT_IMAGE"

      - name: Build final-bound mutants
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$GITHUB_WORKSPACE/formal/current-source/easycrypt/computational"
          mutant_root="$RUNNER_TEMP/easycrypt-final-bound-mutants"
          evidence="$RUNNER_TEMP/easycrypt-final-bound-mutation-evidence"
          mkdir -p "$mutant_root" "$evidence"

          python3 - "$source_dir" "$mutant_root" "$evidence" <<'PY'
          from pathlib import Path
          import shutil
          import sys

          source = Path(sys.argv[1])
          mutant_root = Path(sys.argv[2])
          evidence = Path(sys.argv[3])
          target_name = "LiveBeeKemAuthoritativeFinalBound.ec"

          single_mutations = {
              "drop-operation-signature-loss": (
                  "           q_operation_signature_factor *\n",
                  "           0%r *\n",
              ),
              "drop-fact-signature-loss": (
                  "         + q_fact_signature_factor *\n",
                  "         + 0%r *\n",
              ),
              "drop-node-collision-loss": (
                  "         + Pr[COLL.main(live_auth_initial_state) @ &m : res]\n",
                  "         + 0%r * Pr[COLL.main(live_auth_initial_state) @ &m : res]\n",
              ),
              "drop-beekem-loss": (
                  "         + 2%r *\n"
                  "             (beekem_theorem1_loss",
                  "         + 0%r *\n"
                  "             (beekem_theorem1_loss",
              ),
              "drop-prf-loss": (
                  "         + mdprf_fixed_bit_advantage\n",
                  "         + 0%r * mdprf_fixed_bit_advantage\n",
              ),
              "remove-authloss-proof-link": (
                  "    have Hauthloss :=\n"
                  "      authoritative_live_authentication_failure_bound\n"
                  "        A S Hash K R I &m.\n",
                  "    have Hauthloss : 0%r <= 0%r by smt().\n",
              ),
          }

          def write_mutant(name: str, mutate) -> None:
              destination = mutant_root / name
              shutil.copytree(source, destination)
              target = destination / target_name
              original = target.read_text(encoding="utf-8")
              mutated, description = mutate(original)
              if mutated == original:
                  raise SystemExit(f"{name}: mutation made no change")
              target.write_text(mutated, encoding="utf-8")
              (evidence / f"{name}-edit.txt").write_text(
                  description,
                  encoding="utf-8",
              )

          for name, (needle, replacement) in single_mutations.items():
              def mutate_single(text, needle=needle, replacement=replacement, name=name):
                  count = text.count(needle)
                  if count != 1:
                      raise SystemExit(
                          f"{name}: expected exactly one mutation site, found {count}"
                      )
                  return (
                      text.replace(needle, replacement, 1),
                      f"needle:\n{needle}\nreplacement:\n{replacement}\n",
                  )
              write_mutant(name, mutate_single)

          auth_replacements = [
              (
                  "           q_operation_signature_factor *\n",
                  "           0%r *\n",
              ),
              (
                  "         + q_fact_signature_factor *\n",
                  "         + 0%r *\n",
              ),
              (
                  "         + Pr[COLL.main(live_auth_initial_state) @ &m : res]\n",
                  "         + 0%r * Pr[COLL.main(live_auth_initial_state) @ &m : res]\n",
              ),
              (
                  "         + encoding_failure_probability\n",
                  "         + 0%r * encoding_failure_probability\n",
              ),
          ]

          def drop_all_auth(text: str):
              descriptions = []
              for needle, replacement in auth_replacements:
                  count = text.count(needle)
                  if count != 1:
                      raise SystemExit(
                          "drop-all-authentication-losses: expected exactly one "
                          f"site for {needle!r}, found {count}"
                      )
                  text = text.replace(needle, replacement, 1)
                  descriptions.append(
                      f"needle:\n{needle}\nreplacement:\n{replacement}\n"
                  )
              return text, "\n".join(descriptions)

          write_mutant("drop-all-authentication-losses", drop_all_auth)

          def zero_entire_bound(text: str):
              theorem = text.index("lemma authoritative_live_key_l0_l4_bound")
              start_marker = "         <=\n           q_operation_signature_factor *"
              start = text.index(start_marker, theorem)
              proof = text.index("\n  proof.", start)
              replacement = "         <= 0%r."
              return (
                  text[:start] + replacement + text[proof:],
                  "replaced the complete final right-hand side with 0%r\n",
              )

          write_mutant("zero-entire-final-bound", zero_entire_bound)
          PY

          git rev-parse HEAD | tee "$evidence/source-commit.txt"
          sha256sum "$source_dir/$MUTATED_EC" \
            | tee "$evidence/unmutated-target-sha256.txt"
          find "$mutant_root" -name "$MUTATED_EC" \
            -print -exec sha256sum {} \; \
            | tee "$evidence/mutant-sha256.txt"

      - name: Prove unmutated final theorem checks directly
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$GITHUB_WORKSPACE/formal/current-source/easycrypt/computational"
          evidence="$RUNNER_TEMP/easycrypt-final-bound-mutation-evidence"

          docker run --rm \
            -v "$source_dir:/proof" \
            -w /proof \
            "$EASYCRYPT_IMAGE" \
            bash -lc "
              set -euo pipefail
              echo CHECKING-POSITIVE-CONTROL $MUTATED_EC
              opam exec -- easycrypt compile -no-eco $MUTATED_EC
            " >"$evidence/unmutated-direct-stdout.log" \
              2>"$evidence/unmutated-direct-stderr.log"
          printf '0\n' >"$evidence/unmutated-direct-exit-status.txt"

          docker run --rm \
            -v "$source_dir:/proof" \
            -w /proof \
            "$EASYCRYPT_IMAGE" \
            bash -lc "
              set -euo pipefail
              echo CHECKING-PUBLIC-ENTRY $PUBLIC_EC
              opam exec -- easycrypt compile -no-eco $PUBLIC_EC
            " >"$evidence/unmutated-public-stdout.log" \
              2>"$evidence/unmutated-public-stderr.log"
          printf '0\n' >"$evidence/unmutated-public-exit-status.txt"

      - name: Prove final-bound dependencies are load-bearing
        shell: bash
        run: |
          set -uo pipefail
          mutant_root="$RUNNER_TEMP/easycrypt-final-bound-mutants"
          evidence="$RUNNER_TEMP/easycrypt-final-bound-mutation-evidence"
          unexpected=0

          for mutation in \
            drop-operation-signature-loss \
            drop-fact-signature-loss \
            drop-node-collision-loss \
            drop-all-authentication-losses \
            remove-authloss-proof-link \
            drop-beekem-loss \
            drop-prf-loss \
            zero-entire-final-bound
          do
            proof_dir="$mutant_root/$mutation"
            stdout="$evidence/$mutation-stdout.log"
            stderr="$evidence/$mutation-stderr.log"

            if docker run --rm \
              -v "$proof_dir:/proof" \
              -w /proof \
              "$EASYCRYPT_IMAGE" \
              bash -lc "
                set -uo pipefail
                echo CHECKING-MUTATED-PROOF-BODY $mutation $MUTATED_EC
                opam exec -- easycrypt compile -no-eco $MUTATED_EC
                status=\$?
                if [ \"\$status\" -ne 0 ]; then
                  echo '--- EasyCrypt last goal before expected failure ---'
                  opam exec -- easycrypt llm -lastgoals $MUTATED_EC || true
                fi
                exit \"\$status\"
              " >"$stdout" 2>"$stderr"
            then
              status=0
            else
              status=$?
            fi

            printf '%s\n' "$status" \
              >"$evidence/$mutation-raw-checker-status.txt"

            assertion=0
            if [ "$status" -eq 0 ]; then
              echo "$mutation unexpectedly compiled directly" >&2
              assertion=1
            elif ! grep -Fq 'LiveBeeKemAuthoritativeFinalBound' \
                "$stdout" "$stderr"; then
              echo "$mutation failed outside the mutated final-bound theory" >&2
              assertion=1
            else
              echo "$mutation rejected in the mutated final-bound theory as expected"
            fi

            printf '%s\n' "$assertion" \
              >"$evidence/$mutation-assertion-exit-status.txt"
            if [ "$assertion" -ne 0 ]; then
              unexpected=1
            fi

            echo "--- $mutation diagnostic tail ---"
            grep -E '\[critical\]|unexpectedly compiled|unknown|parse error|lossless|Cannot|cannot|failed|given proof-term' \
              "$stdout" "$stderr" | tail -n 20 || true
          done

          printf '%s\n' "$unexpected" \
            >"$evidence/overall-assertion-exit-status.txt"
          exit "$unexpected"

      - name: Upload mutation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: easycrypt-final-bound-mutations-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/easycrypt-final-bound-mutation-evidence
          if-no-files-found: error
          retention-days: 14
