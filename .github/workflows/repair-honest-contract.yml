name: Repair exact honest contract source

on:
  push:
    branches:
      - formal/easycrypt-unauthorized-reduction
    paths:
      - '.github/workflows/repair-honest-contract.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: formal/easycrypt-unauthorized-reduction
          fetch-depth: 0

      - name: Restore exact source and checkpoint
        shell: bash
        env:
          HOC_GZIP_B64: >-
            
          TARGET_SHA256: db27f24f23a88ea60e3108c29a9afd95c7ec950e6b76f63e427f9704754b88f7
        run: |
          set -euo pipefail
          target='formal/current-source/easycrypt/computational/HonestOperationContract.ec'
          printf '%s' "$HOC_GZIP_B64" | base64 -d | gzip -d > "$target"
          printf '%s  %s\n' "$TARGET_SHA256" "$target" | sha256sum -c -
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          git rm '.github/workflows/repair-honest-contract.yml'
          git commit -m 'formal: restore exact honest contract source'
          git push origin HEAD:formal/easycrypt-unauthorized-reduction
