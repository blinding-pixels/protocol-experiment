name: EasyCrypt computational Milestone 1

on:
  push:
    branches:
      - formal/easycrypt-computational-m1
    paths:
      - '.github/workflows/easycrypt-computational-m1.yml'
      - 'formal/current-source/easycrypt/computational/**'
      - 'tools/easycrypt/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/easycrypt-computational-m1.yml'
      - 'formal/current-source/easycrypt/computational/**'
      - 'tools/easycrypt/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: easycrypt-m1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Diagnose active EasyCrypt proof
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EASYCRYPT_IMAGE: ghcr.io/easycrypt/ec-test-box@sha256:84980006e8b01fe6497bbd0ecd67deeb5e7361d8ad17e27d24924122d368e0fc
    steps:
      - name: Check out exact proof source
        uses: actions/checkout@v4

      - name: Record source identity
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/easycrypt-evidence"
          source_dir="formal/current-source/easycrypt/computational"
          mkdir -p "$evidence/checked-source"
          cp -R "$source_dir"/. "$evidence/checked-source"/
          git rev-parse HEAD | tee "$evidence/source-commit.txt"
          find "$source_dir" -maxdepth 1 -type f \
            \( -name '*.ec' -o -name '*.eca' \) -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum \
            | tee "$evidence/source-sha256.txt"
          git status --short --branch | tee "$evidence/git-status.txt"

      - name: Run repository anti-cheating audit
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/easycrypt-evidence"
          set +e
          python3 tools/easycrypt/audit_computational.py \
            >"$evidence/audit-stdout.log" \
            2>"$evidence/audit-stderr.log"
          status=$?
          set -e
          printf '%s\n' "$status" >"$evidence/audit-exit-status.txt"
          cat "$evidence/audit-stdout.log"
          cat "$evidence/audit-stderr.log" >&2
          exit "$status"

      - name: Pull immutable EasyCrypt image
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/easycrypt-evidence"
          docker pull "$EASYCRYPT_IMAGE" 2>&1 | tee "$evidence/image-pull.log"
          docker image inspect "$EASYCRYPT_IMAGE" >"$evidence/image-inspect.json"
          docker image inspect "$EASYCRYPT_IMAGE" \
            --format '{{json .RepoDigests}}' \
            | tee "$evidence/image-repo-digests.txt"

      - name: Expose active normalizer residual
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$GITHUB_WORKSPACE/formal/current-source/easycrypt/computational"
          proof_dir="$RUNNER_TEMP/easycrypt-source"
          evidence="$RUNNER_TEMP/easycrypt-evidence"
          target="AuthorizationNormalizerExecution.ec"
          mkdir -p "$proof_dir"
          cp -R "$source_dir"/. "$proof_dir"/

          set +e
          docker run --rm \
            -v "$proof_dir:/proof" \
            -w /proof \
            "$EASYCRYPT_IMAGE" \
            bash -lc "opam exec -- easycrypt compile -no-eco $target" \
            >"$evidence/baseline-stdout.log" \
            2>"$evidence/baseline-stderr.log"
          baseline_status=$?
          set -e
          printf '%s\n' "$baseline_status" >"$evidence/baseline-exit-status.txt"
          cat "$evidence/baseline-stdout.log"
          cat "$evidence/baseline-stderr.log" >&2

          if [ "$baseline_status" -eq 0 ]; then
            printf '%s\n' "$target already closes" \
              >"$evidence/diagnostic-target.txt"
            exit 0
          fi

          python3 - "$proof_dir/$target" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()
          suffix = "  by smt().\nqed.\n"
          if not text.endswith(suffix):
              raise SystemExit("normalizer final postcondition tactic was not found")
          path.write_text(text[:-len(suffix)])
          PY

          printf '%s\n' \
            'AuthorizationNormalizerExecution.ec:46 (disposable return residual)' \
            >"$evidence/diagnostic-target.txt"
          cp "$proof_dir/$target" \
            "$evidence/AuthorizationNormalizerExecution-diagnostic.ec"

          set +e
          docker run --rm \
            -v "$proof_dir:/proof" \
            -w /proof \
            "$EASYCRYPT_IMAGE" \
            bash -lc '
              set -euo pipefail
              opam exec -- easycrypt config
              opam exec -- why3 --version || true
              echo CHECKING DISPOSABLE AuthorizationNormalizerExecution.ec COPY UP TO LINE 46
              opam exec -- easycrypt llm -upto 46 AuthorizationNormalizerExecution.ec
            ' >"$evidence/diagnostic-stdout.log" \
              2>"$evidence/diagnostic-stderr.log"
          status=$?
          set -e
          printf '%s\n' "$status" >"$evidence/diagnostic-exit-status.txt"
          cat "$evidence/diagnostic-stdout.log"
          cat "$evidence/diagnostic-stderr.log" >&2
          exit "$status"

      - name: Upload checker evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: easycrypt-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/easycrypt-evidence
          if-no-files-found: error
          retention-days: 14
