name: EasyCrypt computational Milestone 1

on:
  push:
    branches:
      - formal/easycrypt-computational-m1
    paths:
      - '.github/workflows/easycrypt-computational-m1.yml'
      - 'formal/current-source/easycrypt/computational/**'
      - 'tools/easycrypt/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/easycrypt-computational-m1.yml'
      - 'formal/current-source/easycrypt/computational/**'
      - 'tools/easycrypt/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: easycrypt-m1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Diagnose active EasyCrypt proof
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EASYCRYPT_IMAGE: ghcr.io/easycrypt/ec-test-box@sha256:84980006e8b01fe6497bbd0ecd67deeb5e7361d8ad17e27d24924122d368e0fc
    steps:
      - name: Check out exact proof source
        uses: actions/checkout@v4

      - name: Record source identity
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/easycrypt-evidence"
          source_dir="formal/current-source/easycrypt/computational"
          mkdir -p "$evidence/checked-source"
          cp -R "$source_dir"/. "$evidence/checked-source"/
          git rev-parse HEAD | tee "$evidence/source-commit.txt"
          find "$source_dir" -maxdepth 1 -type f \
            \( -name '*.ec' -o -name '*.eca' \) -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum \
            | tee "$evidence/source-sha256.txt"
          git status --short --branch | tee "$evidence/git-status.txt"

      - name: Run repository anti-cheating audit
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/easycrypt-evidence"
          set +e
          python3 tools/easycrypt/audit_computational.py \
            >"$evidence/audit-stdout.log" \
            2>"$evidence/audit-stderr.log"
          status=$?
          set -e
          printf '%s\n' "$status" >"$evidence/audit-exit-status.txt"
          cat "$evidence/audit-stdout.log"
          cat "$evidence/audit-stderr.log" >&2
          exit "$status"

      - name: Pull immutable EasyCrypt image
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/easycrypt-evidence"
          docker pull "$EASYCRYPT_IMAGE" 2>&1 | tee "$evidence/image-pull.log"
          docker image inspect "$EASYCRYPT_IMAGE" >"$evidence/image-inspect.json"
          docker image inspect "$EASYCRYPT_IMAGE" \
            --format '{{json .RepoDigests}}' \
            | tee "$evidence/image-repo-digests.txt"

      - name: Diagnose active EasyCrypt proof
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$GITHUB_WORKSPACE/formal/current-source/easycrypt/computational"
          proof_dir="$RUNNER_TEMP/easycrypt-source"
          evidence="$RUNNER_TEMP/easycrypt-evidence"
          mkdir -p "$proof_dir"
          cp -R "$source_dir"/. "$proof_dir"/

          # First ask the pinned checker for the active failing source line.
          # The expected failure is recorded as evidence and never changes the
          # committed proof source.
          set +e
          docker run --rm \
            -v "$proof_dir:/proof" \
            -w /proof \
            "$EASYCRYPT_IMAGE" \
            bash -lc '
              set -euo pipefail
              opam exec -- easycrypt config
              opam exec -- why3 --version || true
              opam exec -- easycrypt compile -no-eco MutationProofs.ec
            ' >"$evidence/baseline-stdout.log" \
              2>"$evidence/baseline-stderr.log"
          baseline_status=$?
          set -e
          printf '%s\n' "$baseline_status" \
            >"$evidence/baseline-exit-status.txt"
          cat "$evidence/baseline-stdout.log"
          cat "$evidence/baseline-stderr.log" >&2

          if [ "$baseline_status" -eq 0 ]; then
            printf '%s\n' \
              'MutationProofs.ec already closes under the pinned checker' \
              >"$evidence/diagnostic-target.txt"
            exit 0
          fi

          # Open only the atomic rcond proof reported by the checker.  For a
          # one-line `first by auto` proof, add a separate `auto` command.  For
          # an expanded proof block, remove only `first by` and retain every
          # committed tactic.  The helper therefore follows the next residual
          # automatically instead of requiring CI-only retarget commits.
          python3 - \
            "$proof_dir/MutationProofs.ec" \
            "$evidence/baseline-stdout.log" \
            "$evidence/baseline-stderr.log" \
            "$evidence/diagnostic-line.txt" \
            "$evidence/diagnostic-target.txt" <<'PY'
          from pathlib import Path
          import re
          import sys

          source_path = Path(sys.argv[1])
          stdout_path = Path(sys.argv[2])
          stderr_path = Path(sys.argv[3])
          line_path = Path(sys.argv[4])
          target_path = Path(sys.argv[5])

          checker_output = (
              stdout_path.read_text(errors="replace")
              + "\n"
              + stderr_path.read_text(errors="replace")
          )
          matches = []
          for pattern in (
              r"\[MutationProofs\.ec: line (\d+)(?: \(|\])",
              r"\[MutationProofs\.ec:(\d+)\]",
          ):
              matches.extend(int(value) for value in re.findall(pattern, checker_output))
          if not matches:
              raise SystemExit("checker did not report a MutationProofs.ec line")

          reported_line = matches[-1]
          lines = source_path.read_text().splitlines(keepends=True)
          if reported_line < 1 or reported_line > len(lines):
              raise SystemExit(f"reported line {reported_line} is outside MutationProofs.ec")

          start = reported_line - 1
          atomic = re.compile(
              r"^(?P<indent>\s*)(?P<rcond>rcond[tf]\s+\^while);\s+first\s+by(?P<tail>.*)$"
          )
          match = atomic.match(lines[start].rstrip("\n"))

          # Some checker versions point at a tactic inside the atomic block.
          # Walk backward only to the nearest enclosing rcond proof.
          if match is None:
              for candidate in range(start - 1, -1, -1):
                  candidate_match = atomic.match(lines[candidate].rstrip("\n"))
                  if candidate_match is not None:
                      start = candidate
                      match = candidate_match
                      break
          if match is None:
              raise SystemExit(
                  f"line {reported_line} is not inside an atomic rcond proof"
              )

          indent = match.group("indent")
          rcond = match.group("rcond")
          tail = match.group("tail").strip()

          if tail == "auto.":
              lines[start] = f"{indent}{rcond}.\n{indent}auto.\n"
              target_line = start + 2
          else:
              lines[start] = lines[start].replace("; first by", ".", 1)
              base_indent = len(indent)
              next_command = len(lines)
              for candidate in range(start + 1, len(lines)):
                  stripped = lines[candidate].strip()
                  if not stripped:
                      continue
                  leading = len(lines[candidate]) - len(lines[candidate].lstrip())
                  if leading <= base_indent:
                      next_command = candidate
                      break
              target_line = next_command

          source_path.write_text("".join(lines))
          line_path.write_text(f"{target_line}\n")
          target_path.write_text(
              f"MutationProofs.ec:{target_line} "
              f"(disposable residual for checker line {reported_line})\n"
          )
          PY

          target_line="$(cat "$evidence/diagnostic-line.txt")"
          cp "$proof_dir/MutationProofs.ec" \
            "$evidence/MutationProofs-diagnostic.ec"

          set +e
          docker run --rm \
            -e DIAGNOSTIC_LINE="$target_line" \
            -v "$proof_dir:/proof" \
            -w /proof \
            "$EASYCRYPT_IMAGE" \
            bash -lc '
              set -euo pipefail
              opam exec -- easycrypt config
              opam exec -- why3 --version || true
              echo "CHECKING DISPOSABLE MutationProofs.ec COPY UP TO LINE $DIAGNOSTIC_LINE"
              opam exec -- easycrypt llm -upto "$DIAGNOSTIC_LINE" MutationProofs.ec
            ' >"$evidence/diagnostic-stdout.log" \
              2>"$evidence/diagnostic-stderr.log"
          status=$?
          set -e
          printf '%s\n' "$status" >"$evidence/diagnostic-exit-status.txt"
          cat "$evidence/diagnostic-stdout.log"
          cat "$evidence/diagnostic-stderr.log" >&2
          exit "$status"

      - name: Upload checker evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: easycrypt-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/easycrypt-evidence
          if-no-files-found: error
          retention-days: 14
