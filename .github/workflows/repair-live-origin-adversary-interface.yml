name: Repair live origin adversary interface

on:
  push:
    branches:
      - formal/easycrypt-live-key-reduction
    paths:
      - '.github/workflows/repair-live-origin-adversary-interface.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: formal/easycrypt-live-key-reduction
          fetch-depth: 0

      - name: Restrict live construction to Deliverable A interface
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('formal/current-source/easycrypt/computational/LiveAuthenticationReduction.ec')
          text = path.read_text(encoding='utf-8')

          marker = '''type live_authentication_result = {
            lar_live_success : bool;
            lar_authentication_failure : bool
          }.
          '''
          wrapper = '''(* Restrict the concrete live construction to Deliverable A's exact public
             adversary interface before supplying it to the existing reduction functors.
             The wrapper forwards the sole procedure and introduces no event or premise. *)
          module BLiveOriginAdversary(
            A : LIVE_KEY_ADVERSARY,
            B : BEEKEM_LIVE_RUNTIME,
            K : MULTI_DOMAIN_KEY_SCHEDULE,
            R : LIVE_KEY_SAMPLER
          )(Auth : ORIGIN_TRACKED_UNAUTHORIZED_ORACLE) = {
            module Core = BLiveAuthentication(A, B, K, R, Auth)

            proc attack() : unit = {
              Core.attack();
            }
          }.

          '''
          if marker not in text:
              raise SystemExit('live result marker missing')
          text = text.replace(marker, wrapper + marker, 1)

          old = 'BLiveAuthentication(A, B, K, R)'
          if text.count(old) != 4:
              raise SystemExit(f'expected four reduction uses, found {text.count(old)}')
          text = text.replace(old, 'BLiveOriginAdversary(A, B, K, R)')
          path.write_text(text, encoding='utf-8')
          PY

          python3 tools/easycrypt/audit_computational.py
          python3 -m unittest discover \
            -s formal/current-source/easycrypt/computational \
            -p 'test_*.py' -v
          git diff --check

      - name: Commit exact-source repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name blinding-pixels
          git config user.email blindingpixels@protonmail.com
          git rm -- .github/workflows/repair-live-origin-adversary-interface.yml
          git add formal/current-source/easycrypt/computational/LiveAuthenticationReduction.ec
          git commit -m 'fix: restrict live adversary to authorization interface'
          git push origin HEAD:formal/easycrypt-live-key-reduction
          git rev-parse HEAD
