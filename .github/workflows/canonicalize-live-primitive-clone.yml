name: Canonicalize live primitive-game clone

on:
  push:
    branches:
      - formal/easycrypt-live-key-reduction
    paths:
      - '.github/workflows/canonicalize-live-primitive-clone.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: formal/easycrypt-live-key-reduction
          fetch-depth: 0

      - name: Reuse Deliverable A primitive clone throughout live closure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('formal/current-source/easycrypt/computational')

          path = root / 'LiveKeyGame.ec'
          text = path.read_text(encoding='utf-8')
          old = '''require import ProtocolChecks ProtocolOracles AuthorizationAncestry.\nrequire PrimitiveGames.\nclone import PrimitiveGames as PG.\nrequire import UnauthorizedOriginGame.\n'''
          new = '''require import ProtocolChecks ProtocolOracles AuthorizationAncestry.\nrequire import UnauthorizedSignatureReduction UnauthorizedOriginGame.\n\nimport PG.\n'''
          if old not in text:
              raise SystemExit('LiveKeyGame canonical-clone pattern missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = root / 'LiveKeyWitnesses.ec'
          text = path.read_text(encoding='utf-8')
          old = '''require import ProtocolChecks UnauthorizedOriginGame LiveKeyGame.\nrequire PrimitiveGames.\nclone import PrimitiveGames as PG.\n'''
          new = '''require import ProtocolChecks UnauthorizedSignatureReduction UnauthorizedOriginGame LiveKeyGame.\n\nimport PG.\n'''
          if old not in text:
              raise SystemExit('LiveKeyWitnesses canonical-clone pattern missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = root / 'LiveAuthenticationReduction.ec'
          text = path.read_text(encoding='utf-8')
          old = 'require import AuthorizationAncestry UnauthorizedOriginGame.\n'
          new = 'require import AuthorizationAncestry UnauthorizedSignatureReduction UnauthorizedOriginGame.\n'
          if old not in text:
              raise SystemExit('LiveAuthenticationReduction import pattern missing')
          text = text.replace(old, new, 1)
          old = 'require import UnauthorizedOriginHashReduction LiveKeyGame.\n\n\n'
          new = 'require import UnauthorizedOriginHashReduction LiveKeyGame.\n\nimport PG.\n\n'
          if old not in text:
              raise SystemExit('LiveAuthenticationReduction PG import position missing')
          text = text.replace(old, new, 1)
          text = text.replace('UnauthorizedSignatureReduction.PG.', 'PG.')
          path.write_text(text, encoding='utf-8')
          PY

          python3 tools/easycrypt/audit_computational.py
          python3 -m unittest discover \
            -s formal/current-source/easycrypt/computational \
            -p 'test_*.py' -v
          git diff --check

      - name: Commit exact-source repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name blinding-pixels
          git config user.email blindingpixels@protonmail.com
          git rm -- .github/workflows/canonicalize-live-primitive-clone.yml
          git add \
            formal/current-source/easycrypt/computational/LiveKeyGame.ec \
            formal/current-source/easycrypt/computational/LiveKeyWitnesses.ec \
            formal/current-source/easycrypt/computational/LiveAuthenticationReduction.ec
          git commit -m 'fix: share canonical primitive game across live closure'
          git push origin HEAD:formal/easycrypt-live-key-reduction
          git rev-parse HEAD
