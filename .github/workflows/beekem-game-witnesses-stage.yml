name: Stage BeeKEM KI game witnesses

on:
  push:
    branches:
      - formal/easycrypt-beekem-interface
    paths:
      - '.github/workflows/beekem-game-witnesses-stage.yml'

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: formal/easycrypt-beekem-interface
          fetch-depth: 0

      - name: Install checker-facing witness sources
        shell: bash
        env:
          PAYLOAD_B64: ''
        run: |
          set -euo pipefail
          printf '%s' "$PAYLOAD_B64" | base64 --decode > /tmp/beekem-game-witnesses.tar.gz
          printf '%s  %s\n' '4af71b7ab5d56b2c7b3bea65e09a9dd7ceef11567def4f324d1c323cbf778493' /tmp/beekem-game-witnesses.tar.gz | sha256sum --check
          tar -xzf /tmp/beekem-game-witnesses.tar.gz -C .
          git config user.name 'blinding-pixels'
          git config user.email 'blindingpixels@protonmail.com'
          git add             formal/current-source/easycrypt/computational/BeeKemKiGame.ec             formal/current-source/easycrypt/computational/BeeKemGameWitnesses.ec             formal/current-source/easycrypt/computational/BeeKemInterfaceProof.ec
          git rm .github/workflows/beekem-game-witnesses-stage.yml
          git diff --cached --check
          git commit -m 'formal: prove BeeKEM KI game non-vacuity'
          git push origin HEAD:formal/easycrypt-beekem-interface
