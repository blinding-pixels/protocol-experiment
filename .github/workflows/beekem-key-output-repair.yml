name: One-shot BeeKEM key-output repair

on:
  push:
    branches:
      - formal/easycrypt-beekem-interface
    paths:
      - '.github/workflows/beekem-key-output-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: formal/easycrypt-beekem-interface
          fetch-depth: 0

      - name: Require an actual group-secret value
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('formal/current-source/easycrypt/computational/BeeKemProtocol.ec')
          text = path.read_text(encoding='utf-8')
          old = '''    if (beekem_secret_output_is_undefined secret) {
                accepted <- false;
                rejection <- Some BeeRejectMissingSecret;
              }
          '''
          new = '''    if (! beekem_secret_output_is_value secret) {
                accepted <- false;
                rejection <- Some BeeRejectMissingSecret;
              }
          '''
          assert text.count(old) == 2, text.count(old)
          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY

          rm .github/workflows/beekem-key-output-repair.yml
          git diff --check
          git diff -- formal/current-source/easycrypt/computational/BeeKemProtocol.ec

      - name: Commit repaired semantics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name blinding-pixels
          git config user.email blindingpixels@protonmail.com
          git add -A
          git commit -m 'fix: require key-valued BeeKEM reveal and challenge'
          git push origin HEAD:formal/easycrypt-beekem-interface
