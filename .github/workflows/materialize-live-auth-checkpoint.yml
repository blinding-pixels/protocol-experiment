name: Materialize live authentication checkpoint

on:
  push:
    branches:
      - formal/easycrypt-live-key-reduction
    paths:
      - '.github/workflows/materialize-live-auth-checkpoint.yml'
      - '.github/live-auth-checkpoint.tar.gz.b64'

permissions:
  contents: write
  actions: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Materialize, audit, test, commit, and dispatch checker
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          base64 --decode .github/live-auth-checkpoint.tar.gz.b64 | tar -xzf -
          rm .github/live-auth-checkpoint.tar.gz.b64
          rm .github/workflows/materialize-live-auth-checkpoint.yml

          python3 tools/easycrypt/audit_computational.py
          python3 -m unittest discover \
            -s formal/current-source/easycrypt/computational \
            -p 'test_*.py' -v

          git config user.name 'blinding-pixels'
          git config user.email 'blindingpixels@protonmail.com'
          git add -A
          git commit -m 'formal: connect live authentication failures to Deliverable A'
          git push origin "HEAD:${GITHUB_REF_NAME}"

          curl --fail --silent --show-error --location \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/easycrypt-computational.yml/dispatches" \
            --data "{\"ref\":\"${GITHUB_REF_NAME}\"}"
