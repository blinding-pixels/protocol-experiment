name: Repair live primitive imports

on:
  push:
    branches:
      - formal/easycrypt-live-key-reduction
    paths:
      - '.github/workflows/repair-live-primitive-imports.yml'

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: formal/easycrypt-live-key-reduction
          fetch-depth: 0

      - name: Apply exact EasyCrypt abstract-theory repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('formal/current-source/easycrypt/computational')
          replacements = {
              'LiveKeyGame.ec': (
                  'require import PrimitiveGames UnauthorizedOriginGame.\n\nimport PG.',
                  'require PrimitiveGames.\nclone import PrimitiveGames as PG.\nrequire import UnauthorizedOriginGame.',
              ),
              'LiveKeyWitnesses.ec': (
                  'require import ProtocolChecks PrimitiveGames UnauthorizedOriginGame LiveKeyGame.\n\nimport PG.',
                  'require import ProtocolChecks UnauthorizedOriginGame LiveKeyGame.\nrequire PrimitiveGames.\nclone import PrimitiveGames as PG.',
              ),
              'LiveAuthenticationReduction.ec': (
                  'require import AuthorizationAncestry PrimitiveGames UnauthorizedOriginGame.',
                  'require import AuthorizationAncestry UnauthorizedOriginGame.\nrequire PrimitiveGames.\nclone import PrimitiveGames as PG.',
              ),
          }

          for filename, (old, new) in replacements.items():
              path = root / filename
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'exact repair pattern missing in {filename}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          python3 tools/easycrypt/audit_computational.py
          python3 -m unittest discover \
            -s formal/current-source/easycrypt/computational \
            -p 'test_*.py' -v
          git diff --check

      - name: Commit repair and dispatch pinned checker
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name blinding-pixels
          git config user.email blindingpixels@protonmail.com
          git rm -- .github/workflows/repair-live-primitive-imports.yml
          git add \
            formal/current-source/easycrypt/computational/LiveKeyGame.ec \
            formal/current-source/easycrypt/computational/LiveKeyWitnesses.ec \
            formal/current-source/easycrypt/computational/LiveAuthenticationReduction.ec
          git commit -m 'fix: clone abstract primitive games in live proof'
          git push origin HEAD:formal/easycrypt-live-key-reduction
          commit_sha="$(git rev-parse HEAD)"
          printf 'repaired_commit=%s\n' "$commit_sha"
          curl --fail-with-body --silent --show-error --location \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/easycrypt-computational.yml/dispatches" \
            --data '{"ref":"formal/easycrypt-live-key-reduction"}'
