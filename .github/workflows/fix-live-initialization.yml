name: Fix live suffix initialization

on:
  push:
    branches:
      - formal/easycrypt-live-key-reduction
    paths:
      - '.github/workflows/fix-live-initialization.yml'

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Patch deterministic suffix replay, audit, commit, and check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('formal/current-source/easycrypt/computational/LiveKeyGame.ec')
          text = path.read_text(encoding='utf-8')

          anchor = '''module type LIVE_KEY_ADVERSARY(O : LIVE_PROTOCOL_ORACLE) = {
            proc attack() : unit
            proc guess() : bool
          }.

          module LiveReal(
          '''
          replacement = '''module type LIVE_KEY_ADVERSARY(O : LIVE_PROTOCOL_ORACLE) = {
            proc attack() : unit
            proc guess() : bool
          }.

          (* Deliverable A proves a suffix game over a materialized public state.  The
             initial authorization value used to label BeeKEM-derived application keys
             is reconstructed deterministically from that public suffix input.  This
             operator performs no signature call and assumes no authentication bit;
             malformed or policy-invalid material yields [None] and makes the live
             experiment ineligible. *)
          op live_initial_authorization
              (initial_state : protocol_state)
              (initial_facts : signed_authorization_fact list) :
              authorization_state option =
            authorization_policy_replay
              initial_state.`ps_creator
              initial_facts.

          op live_initial_authorization_digest
              (initial_state : protocol_state)
              (initial_facts : signed_authorization_fact list) :
              authorization_digest =
            let initial_authorization =
              live_initial_authorization initial_state initial_facts in
            if initial_authorization = None
            then InvalidAuthorizationDigest 0
            else authorization_digest_of (oget initial_authorization).

          module LiveReal(
          '''
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one live adversary anchor, found {text.count(anchor)}')
          text = text.replace(anchor, replacement)

          real_old = '''    var challenge_bit : bool;
              var adversary_guess : bool;
              var normalized_valid : bool;
              var normalized_state : authorization_state;
              var initial_digest : authorization_digest;

              normalized_valid <- false;
              normalized_state <- empty_authorization_state;
              initial_digest <- InvalidAuthorizationDigest 0;

              SO.init();
              Auth.init(initial_state);
              (normalized_valid, normalized_state) <@
                NormalizeAuthorization(Auth.Scheme).normalize(
                  initial_facts,
                  initial_state.`ps_creator
                );
              initial_digest <-
                if normalized_valid
                then authorization_digest_of normalized_state
                else InvalidAuthorizationDigest 0;

              challenge_bit <$ {0,1};
          '''
          real_new = '''    var challenge_bit : bool;
              var adversary_guess : bool;
              var initial_authorization : authorization_state option;
              var initial_digest : authorization_digest;

              initial_authorization <- None;
              initial_digest <- InvalidAuthorizationDigest 0;

              SO.init();
              Auth.init(initial_state);
              initial_authorization <-
                live_initial_authorization initial_state initial_facts;
              initial_digest <-
                live_initial_authorization_digest initial_state initial_facts;

              challenge_bit <$ {0,1};
          '''
          if text.count(real_old) != 1:
              raise SystemExit(f'expected one LiveReal initialization, found {text.count(real_old)}')
          text = text.replace(real_old, real_new)

          real_return_old = '''    return
                   live_trace_admissible
                     retention_kappa O.relation O.queries O.runtime_fault
                /\\ adversary_guess = challenge_bit;
          '''
          real_return_new = '''    return
                   initial_authorization <> None
                /\\ live_trace_admissible
                     retention_kappa O.relation O.queries O.runtime_fault
                /\\ adversary_guess = challenge_bit;
          '''
          if text.count(real_return_old) != 1:
              raise SystemExit(f'expected one LiveReal return, found {text.count(real_return_old)}')
          text = text.replace(real_return_old, real_return_new)

          bit_old = '''    var adversary_guess : bool;
              var normalized_valid : bool;
              var normalized_state : authorization_state;
              var initial_digest : authorization_digest;

              normalized_valid <- false;
              normalized_state <- empty_authorization_state;
              initial_digest <- InvalidAuthorizationDigest 0;

              SO.init();
              Auth.init(initial_state);
              (normalized_valid, normalized_state) <@
                NormalizeAuthorization(Auth.Scheme).normalize(
                  initial_facts,
                  initial_state.`ps_creator
                );
              initial_digest <-
                if normalized_valid
                then authorization_digest_of normalized_state
                else InvalidAuthorizationDigest 0;

              O.init(
          '''
          bit_new = '''    var adversary_guess : bool;
              var initial_authorization : authorization_state option;
              var initial_digest : authorization_digest;

              initial_authorization <- None;
              initial_digest <- InvalidAuthorizationDigest 0;

              SO.init();
              Auth.init(initial_state);
              initial_authorization <-
                live_initial_authorization initial_state initial_facts;
              initial_digest <-
                live_initial_authorization_digest initial_state initial_facts;

              O.init(
          '''
          if text.count(bit_old) != 1:
              raise SystemExit(f'expected one LiveRealBit initialization, found {text.count(bit_old)}')
          text = text.replace(bit_old, bit_new)

          bit_return_old = '''    return
                   live_trace_admissible
                     retention_kappa O.relation O.queries O.runtime_fault
                /\\ adversary_guess;
          '''
          bit_return_new = '''    return
                   initial_authorization <> None
                /\\ live_trace_admissible
                     retention_kappa O.relation O.queries O.runtime_fault
                /\\ adversary_guess;
          '''
          if text.count(bit_return_old) != 1:
              raise SystemExit(f'expected one LiveRealBit return, found {text.count(bit_return_old)}')
          path.write_text(text.replace(bit_return_old, bit_return_new), encoding='utf-8')
          PY

          rm .github/workflows/fix-live-initialization.yml
          python3 tools/easycrypt/audit_computational.py
          python3 -m unittest discover \
            -s formal/current-source/easycrypt/computational \
            -p 'test_*.py' -v

          git config user.name 'blinding-pixels'
          git config user.email 'blindingpixels@protonmail.com'
          git add -A
          git commit -m 'fix: align live initialization with suffix authorization replay'
          git push origin "HEAD:${GITHUB_REF_NAME}"

          curl --fail --silent --show-error --location \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/easycrypt-computational.yml/dispatches" \
            --data "{\"ref\":\"${GITHUB_REF_NAME}\"}"
